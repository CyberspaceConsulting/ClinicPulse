backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/**'
          - 'tests/backend/**'

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**'
          - 'tests/frontend/**'

docker:
  - changed-files:
      - any-glob-to-any-file:
          - 'docker/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/requirements.txt'
          - 'frontend/package.json'
          - 'frontend/package-lock.json'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
