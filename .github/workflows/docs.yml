name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: docs
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        id: configure
      - uses: actions/checkout@v6
        with:
          # Full history, for each page's "Last updated" date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        id: install
        run: npm ci --prefix docs
      # Fails on dead links.
      - name: Build documentation
        id: build
        run: npm run build --prefix docs
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Summarize documentation deployment
        if: always()
        env:
          CONFIGURE_STATUS: ${{ steps.configure.outcome }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          UPLOAD_STATUS: ${{ steps.upload.outcome }}
          DEPLOY_STATUS: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo '## Documentation'
            echo
            printf '| Check | Status |\n| --- | --- |\n'
            printf '| Configure Pages | %s |\n' "${CONFIGURE_STATUS:-not run}"
            printf '| Install dependencies | %s |\n' "${INSTALL_STATUS:-not run}"
            printf '| Build and link validation | %s |\n' "${BUILD_STATUS:-not run}"
            printf '| Upload Pages artifact | %s |\n' "${UPLOAD_STATUS:-not run}"
            printf '| Deploy | %s |\n' "${DEPLOY_STATUS:-not run}"
            if [ "$DEPLOY_STATUS" = success ] && [ -n "$PAGE_URL" ]; then
              printf '\nPublished documentation: %s\n' "$PAGE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
