name: Greetings

on:
  pull_request:
    types:
      - opened
  issues:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Greet First-Time Contributors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: |
            ## 👋 Willkommen bei ClinicPulse und danke für dein erstes Issue!

            Danke, dass du dir die Zeit genommen hast. Fehlerberichte, Ideen und Fragen helfen, ClinicPulse zu verbessern. Wir schauen uns das Issue so bald wie möglich an. Damit wir schnell reagieren können, helfen folgende Angaben:

            ### 🐛 Fehler melden?

            Bitte gib an:

            - **ClinicPulse-Version** bzw. Commit und **wie du es betreibst** (Docker Compose, lokal …).
            - **Schritte zur Reproduktion** sowie erwartetes und tatsächliches Verhalten.
            - **Logs** aus dem betreffenden Zeitraum:

            ```bash
            docker compose logs --tail 100
            ```

            > [!WARNING]
            > Bitte keine Zugangsdaten, Lizenz-Tokens, Schlüssel oder echten Personen- und Gesundheitsdaten in Issues einfügen. Logs und Screenshots vorher bereinigen.

            ### 💡 Feature vorschlagen?

            Beschreibe zuerst das Problem, das du lösen möchtest, und dann deine Lösungsidee.

            ### 🛠️ Selbst beitragen?

            Gerne! Hinterlasse einen Kommentar, damit niemand doppelt arbeitet. Bei größeren Änderungen klären wir den Ansatz bitte zuerst in diesem Issue. Hinweise zu Tests findest du in [TEST.md](https://github.com/the1andoni/ClinicPulse/blob/main/TEST.md).

            ### 📌 Gut zu wissen

            - Es können Rückfragen kommen. Eine kurze Antwort hält das Issue aktuell.
            - Sicherheitslücken bitte nicht öffentlich melden, sondern per E-Mail an info@cyberspaceconsulting.de.

            Danke und willkommen! 🩺
          pr_message: |
            ## 👋 Willkommen bei ClinicPulse und danke für deinen ersten Pull Request!

            Schön, dass du da bist. Jeder Beitrag (Code, Tests oder Dokumentation) hilft dem Projekt. Wir prüfen den PR so bald wie möglich. Damit er schnell gemergt werden kann, beachte bitte Folgendes:

            ### ✅ Vor dem Review

            - **Auf den aktuellen `main` rebasen**, damit der Diff nur deine Änderung enthält.
            - **Backend-Tests ausführen:** `./tests/run-tests.sh`. Neues Verhalten sollte durch Tests abgedeckt sein, oder die Beschreibung erklärt, warum das nicht geht.
            - **Frontend prüfen:** in `frontend` `npm ci`, `npm run build` und `npm run test:e2e`.
            - **Doku aktualisieren**, wenn die Änderung sichtbar ist (neue Einstellung, Umgebungsvariable, Endpunkt oder UI-Element): kurz in der `README.md` bzw. in `TEST.md`.

            <details>
            <summary><strong>🧭 Projektregeln</strong></summary>

            <br>

            - **Tests laufen offline** und ohne Produktivdaten oder externe Dienste.
            - **API- und Berechtigungsänderungen** brauchen Tests für Erfolgsfälle, Validierung und fehlende Berechtigungen.
            - **PostgreSQL-Integrationstests** nur gegen eine entbehrliche Testdatenbank (`TEST_POSTGRES_URL`), niemals gegen Produktivdaten.
            - **Keine Geheimnisse committen:** Zugangsdaten, Lizenz-Tokens, Schlüssel und echte Personen- oder Gesundheitsdaten gehören nicht in Code, Testdaten oder PRs.

            </details>

            ### 📝 Eine gute PR-Beschreibung

            - **Was** sich ändert und **warum**, plus `Closes #123`, falls ein Issue behoben wird.
            - **Screenshots** bei UI-Änderungen.
            - **Wie du getestet hast:** welche Befehle du ausgeführt hast.

            ### 💬 Hilfe nötig?

            - Fragen zum Code oder zur Richtung einer Änderung: gerne direkt hier im PR.
            - Größere Änderungen starten besser als [Issue](https://github.com/the1andoni/ClinicPulse/issues), damit wir den Umfang vorab klären.
            - Sicherheitslücken bitte nicht öffentlich posten, sondern per E-Mail an **info@cyberspaceconsulting.de**.

            Reviews sind ein Austausch. Ein bis zwei Feedbackrunden sind normal. Für dieses Repository ist derzeit keine Lizenzdatei hinterlegt.

            Danke und willkommen an Bord! 🩺
