name: Greetings

on:
  pull_request:
    types:
      - opened
  issues:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Greet First-Time Contributors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/first-interaction@v3
        id: greeting
        with:
          issue_message: |
            ## 👋 Welcome to Medora, and thanks for opening your first issue!

            Thanks for taking the time to report this. Bug reports, ideas and questions from users are how Medora gets better. A maintainer will triage this issue as soon as possible. In the meantime, here's what helps us act on it quickly.

            ### 🐛 Reporting a bug?

            Please make sure the issue includes:

            - **Medora version** and **how you run it** (for example Docker Compose or locally).
            - **Steps to reproduce**, plus what you expected and what happened instead.
            - Relevant logs, after removing passwords, tokens, personal information and other sensitive data.
              For a Docker Compose deployment, run this from the directory containing the Compose file:

            ```bash
            docker compose logs --tail 100 backend web
            ```

            💡 Suggesting a feature?

            - Start with the problem you're trying to solve, then the solution you have in mind. That makes it easier to find the best fit for the project.
            
            ❓ Asking a question?

            Check the documentation first. Open-ended questions and setup help also fit well in Discussions, where other users can chime in.

            🛠️  Want to fix it yourself?

            You're very welcome to! Leave a comment here so nobody duplicates the work, then read [CONTRIBUTING.md](https://github.com/CyberspaceConsulting/Medora/blob/alpha/CONTRIBUTING.md) for the setup and PR checklist. For bigger changes, let's agree on the approach in this issue before you write the code. See the [internationalization guide](https://cyberspaceconsulting.github.io/Medora/features/internationalization) for translations.

            📌 Good to know

            - We may ask follow-up questions. Inactive issues can be marked stale and closed, so a quick reply helps.
            - Found a security vulnerability? Please don't discuss it publicly. Email info@cyberspaceconsulting.de instead.

            Thanks again, and welcome!
          pr_message: |
            ## 👋 Welcome to Medora, and thanks for your first pull request!

            It's great to have you here. Code, tests, documentation and translations all help improve Medora. A maintainer will review your contribution.

            ### ✅ Before review

            - **Target the appropriate branch**, usually `alpha`, and keep the diff focused on your change.
            - **Run the relevant checks** documented in [TEST.md](https://github.com/CyberspaceConsulting/Medora/blob/alpha/TEST.md). New behavior should include tests where practical.
            - **Update the documentation** for user-facing changes; see [`docs/`](https://github.com/CyberspaceConsulting/Medora/tree/alpha/docs).

            <details>
            <summary><strong>🧭 Project rules worth knowing</strong></summary>

            <br>

            - **Preserve API compatibility.** Document and test any intentional contract changes.
            - **Use the locale files** in `frontend/src/i18n/locales/` for UI text; see the internationalization guide.
            - Follow the project's [contribution guide](https://github.com/CyberspaceConsulting/Medora/blob/alpha/CONTRIBUTING.md).

            </details>

            ### 📝 A good PR description

            - **What** changed and **why**, plus `Closes #123` if it fixes an issue.
            - **Screenshots or a short clip** for UI changes.
            - **How you tested it**, including relevant success and failure cases.

            ### 💬 Need help?

            - Questions about the code or the direction of a change: ask right here, or open a thread in [Discussions](https://github.com/CyberspaceConsulting/Medora/discussions).
            - Bigger changes go more smoothly when they start as an [issue](https://github.com/CyberspaceConsulting/Medora/issues), so we can agree on the scope first.
            - Found a security issue? Please don't post it publicly. Email **info@cyberspaceconsulting.de** instead.

            Reviews are a conversation, so expect a round or two of feedback. That's normal, not a sign something is wrong.

            Thanks again, and welcome aboard!
      - name: Summarize first interaction
        if: always()
        env:
          GREETING_STATUS: ${{ steps.greeting.outcome }}
        run: |
          printf '## First interaction\n\nGreeting action: **%s**. A message is sent only for a first-time contributor; see the logs for details.\n' "${GREETING_STATUS:-not run}" >> "$GITHUB_STEP_SUMMARY"
