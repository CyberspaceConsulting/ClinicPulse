name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinicpulse_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: clinicpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicpulse_test -d clinicpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: ./run-tests.sh
      - name: PostgreSQL encryption, migration and restore tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://clinicpulse_test:test-only-password@localhost:5432/clinicpulse_test
        run: .venv/bin/python -m pytest -q tests/test_postgres_integrity.py

  frontend-browser:
    name: Frontend browser (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: frontend-browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
