name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medora_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: medora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medora_test -d medora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify Python lock and export
        id: lock
        run: |
          python -m pip install uv==0.13.7
          uv lock --check
          make export
          git diff --exit-code -- backend/requirements.txt
      - name: Backend tests
        id: backend_tests
        run: ./tests/run-tests.sh --junitxml="$RUNNER_TEMP/backend-tests.xml"
      - name: PostgreSQL encryption, migration and restore tests
        id: postgres_tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://medora_test:test-only-password@localhost:5432/medora_test
        run: .venv/bin/python -m pytest -q ../tests/backend/test_postgres_integrity.py --junitxml="$RUNNER_TEMP/postgres-tests.xml"
      - name: Upload test reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/backend-tests.xml
            ${{ runner.temp }}/postgres-tests.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize backend tests
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          LOCK_STATUS: ${{ steps.lock.outcome }}
          BACKEND_STATUS: ${{ steps.backend_tests.outcome }}
          POSTGRES_STATUS: ${{ steps.postgres_tests.outcome }}
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          summary_status=0
          {
            printf '## Backend tests (%s)\n\n' "$ARCH"
            printf '| Check | Status |\n| --- | --- |\n'
            printf '| Lock and export | %s |\n' "${LOCK_STATUS:-not run}"
            printf '| Backend tests | %s |\n' "${BACKEND_STATUS:-not run}"
            printf '| PostgreSQL tests | %s |\n\n' "${POSTGRES_STATUS:-not run}"
            if [ -f tests/junit_summary.py ]; then
              python tests/junit_summary.py "Backend" "$RUNNER_TEMP/backend-tests.xml" || summary_status=1
              python tests/junit_summary.py "PostgreSQL" "$RUNNER_TEMP/postgres-tests.xml" || summary_status=1
            else
              echo 'JUnit summaries unavailable: repository checkout did not complete.'
            fi
            echo
            if [ -n "$REPORT_URL" ]; then
              printf '[Download JUnit reports](%s)\n' "$REPORT_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$summary_status"

  frontend-build:
    name: Frontend build and translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        id: install
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        id: build
        working-directory: frontend
        run: npm run build
      - name: Check translation catalogs
        id: translations
        working-directory: frontend
        run: npm run test:i18n
      - name: Summarize frontend build
        if: always()
        env:
          INSTALL_STATUS: ${{ steps.install.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          TRANSLATIONS_STATUS: ${{ steps.translations.outcome }}
        run: |
          printf '## Frontend build and translations\n\n| Check | Status |\n| --- | --- |\n| Install dependencies | %s |\n| Frontend build | %s |\n| Translations | %s |\n' \
            "${INSTALL_STATUS:-not run}" "${BUILD_STATUS:-not run}" "${TRANSLATIONS_STATUS:-not run}" >> "$GITHUB_STEP_SUMMARY"

  # Chromium (desktop and narrow viewport) and Firefox run as separate, independent jobs.
  frontend-browser:
    name: Frontend browser (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: firefox
            label: Firefox
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        id: install
        working-directory: frontend
        run: npm ci
      - name: Install ${{ matrix.label }}
        id: browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests (${{ matrix.label }})
        id: browser
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-reports/browser-${{ matrix.browser }}.xml
        run: npm run test:e2e:${{ matrix.browser }}
      - name: Upload browser report
        id: report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-browser-junit-${{ matrix.browser }}
          path: frontend/test-reports/browser-${{ matrix.browser }}.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v6
        id: traces
        if: failure()
        with:
          name: frontend-browser-test-results-${{ matrix.browser }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize ${{ matrix.label }} browser tests
        if: always()
        env:
          LABEL: ${{ matrix.label }}
          BROWSER: ${{ matrix.browser }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          BROWSERS_STATUS: ${{ steps.browsers.outcome }}
          BROWSER_STATUS: ${{ steps.browser.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          TRACE_URL: ${{ steps.traces.outputs.artifact-url }}
        run: |
          summary_status=0
          {
            printf '## Frontend browser tests (%s)\n\n' "$LABEL"
            printf '| Check | Status |\n| --- | --- |\n'
            printf '| Install dependencies | %s |\n' "${INSTALL_STATUS:-not run}"
            printf '| Install %s | %s |\n' "$LABEL" "${BROWSERS_STATUS:-not run}"
            printf '| Browser tests | %s |\n\n' "${BROWSER_STATUS:-not run}"
            if [ -f tests/junit_summary.py ]; then
              python3 tests/junit_summary.py "$LABEL" "frontend/test-reports/browser-$BROWSER.xml" || summary_status=1
            else
              echo 'JUnit summary unavailable: repository checkout did not complete.'
            fi
            echo
            if [ -n "$REPORT_URL" ]; then
              printf '[Download JUnit report](%s)\n\n' "$REPORT_URL"
            fi
            if [ -n "$TRACE_URL" ]; then
              printf '[Download browser failure traces](%s)\n' "$TRACE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$summary_status"

  compose-smoke:
    name: Docker Compose runtime smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Start the real Compose stack and verify web/API/database
        id: smoke
        run: ./tests/compose-smoke.sh
      - name: Summarize Compose smoke test
        if: always()
        env:
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
        run: |
          printf '## Docker Compose smoke test\n\n| Check | Status |\n| --- | --- |\n| Web, API and database | %s |\n\nSee the step logs for details.\n' "${SMOKE_STATUS:-not run}" >> "$GITHUB_STEP_SUMMARY"
