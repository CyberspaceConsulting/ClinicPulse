name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinicpulse_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: clinicpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicpulse_test -d clinicpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Backend tests
        id: backend_tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q ../tests/backend --junitxml="$RUNNER_TEMP/backend-tests.xml"
      - name: PostgreSQL encryption, migration and restore tests
        id: postgres_tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://clinicpulse_test:test-only-password@localhost:5432/clinicpulse_test
        run: python -m pytest -q ../tests/backend/test_postgres_integrity.py --junitxml="$RUNNER_TEMP/postgres-tests.xml"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Frontend build
        id: build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Upload test reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-backend-test-reports-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/backend-tests.xml
            ${{ runner.temp }}/postgres-tests.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize release tests
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          BACKEND_STATUS: ${{ steps.backend_tests.outcome }}
          POSTGRES_STATUS: ${{ steps.postgres_tests.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          summary_status=0
          {
            printf '## Release tests (%s)\n\n' "$ARCH"
            printf '| Check | Status |\n| --- | --- |\n'
            printf '| Backend tests | %s |\n' "${BACKEND_STATUS:-not run}"
            printf '| PostgreSQL tests | %s |\n' "${POSTGRES_STATUS:-not run}"
            printf '| Frontend build | %s |\n\n' "${BUILD_STATUS:-not run}"
            if [ -f tests/junit_summary.py ]; then
              python tests/junit_summary.py "Backend" "$RUNNER_TEMP/backend-tests.xml" || summary_status=1
              python tests/junit_summary.py "PostgreSQL" "$RUNNER_TEMP/postgres-tests.xml" || summary_status=1
            else
              echo 'JUnit summaries unavailable: repository checkout did not complete.'
            fi
            echo
            if [ -n "$REPORT_URL" ]; then
              printf '[Download JUnit reports](%s)\n' "$REPORT_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$summary_status"

  # Chromium (desktop and narrow viewport) and Firefox run as separate, independent jobs.
  frontend-browser:
    name: Frontend browser (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: firefox
            label: Firefox
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        id: install
        working-directory: frontend
        run: npm ci
      - name: Install ${{ matrix.label }}
        id: browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests (${{ matrix.label }})
        id: browser
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-reports/browser-${{ matrix.browser }}.xml
        run: npm run test:e2e:${{ matrix.browser }}
      - name: Upload browser report
        id: report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-frontend-browser-junit-${{ matrix.browser }}
          path: frontend/test-reports/browser-${{ matrix.browser }}.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v6
        id: traces
        if: failure()
        with:
          name: release-browser-test-results-${{ matrix.browser }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize release ${{ matrix.label }} browser tests
        if: always()
        env:
          LABEL: ${{ matrix.label }}
          BROWSER: ${{ matrix.browser }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          BROWSERS_STATUS: ${{ steps.browsers.outcome }}
          BROWSER_STATUS: ${{ steps.browser.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          TRACE_URL: ${{ steps.traces.outputs.artifact-url }}
        run: |
          summary_status=0
          {
            printf '## Release browser tests (%s)\n\n' "$LABEL"
            printf '| Check | Status |\n| --- | --- |\n'
            printf '| Install dependencies | %s |\n' "${INSTALL_STATUS:-not run}"
            printf '| Install %s | %s |\n' "$LABEL" "${BROWSERS_STATUS:-not run}"
            printf '| Browser tests | %s |\n\n' "${BROWSER_STATUS:-not run}"
            if [ -f tests/junit_summary.py ]; then
              python3 tests/junit_summary.py "$LABEL" "frontend/test-reports/browser-$BROWSER.xml" || summary_status=1
            else
              echo 'JUnit summary unavailable: repository checkout did not complete.'
            fi
            echo
            if [ -n "$REPORT_URL" ]; then
              printf '[Download JUnit report](%s)\n\n' "$REPORT_URL"
            fi
            if [ -n "$TRACE_URL" ]; then
              printf '[Download browser failure traces](%s)\n' "$TRACE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$summary_status"

  compose-smoke:
    name: Docker Compose runtime smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Start the real Compose stack and verify web/API/database
        id: smoke
        run: ./tests/compose-smoke.sh
      - name: Summarize Compose smoke test
        if: always()
        env:
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
        run: |
          printf '## Release Docker Compose smoke test\n\n| Check | Status |\n| --- | --- |\n| Web, API and database | %s |\n\nSee the step logs for details.\n' "${SMOKE_STATUS:-not run}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [test, frontend-browser, compose-smoke]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend_image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./docker/api.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/cyberspaceconsulting/clinicpulse-backend:${{ env.IMAGE_TAG }}
          build-args: |
            CLINICPULSE_IMAGE_VERSION=${{ env.IMAGE_TAG }}
          provenance: true
          sbom: true

      - name: Build and push web image
        id: web_image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./docker/web.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/cyberspaceconsulting/clinicpulse-web:${{ env.IMAGE_TAG }}
          provenance: true
          sbom: true

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@8e94d75ddd33f69f691467e42275782e4bfefe84
        with:
          syft-version: v1.57.0

      - name: Generate and validate CycloneDX SBOM
        id: sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist sbom
          for arch in amd64 arm64; do
            "$SYFT" scan "registry:ghcr.io/cyberspaceconsulting/clinicpulse-backend@${BACKEND_DIGEST}" \
              --platform "linux/${arch}" -o "cyclonedx-json=sbom/api-${arch}.json"
            "$SYFT" scan "registry:ghcr.io/cyberspaceconsulting/clinicpulse-web@${WEB_DIGEST}" \
              --platform "linux/${arch}" -o "cyclonedx-json=sbom/web-${arch}.json"
          done
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true \
            "$SYFT" scan dir:frontend -o cyclonedx-json=sbom/frontend-dependencies.json
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("api-amd64", "api-arm64", "web-amd64", "web-arm64", "frontend-dependencies"):
              bom = json.loads(Path(f"sbom/{name}.json").read_text())
              components = bom.get("components", [])
              if bom.get("bomFormat") != "CycloneDX" or not components:
                  raise SystemExit(f"Empty or invalid SBOM: {name}")
              names = {component.get("name", "").lower() for component in components}
              required = {"fastapi"} if name.startswith("api-") else (
                  {"vue", "vite"} if name == "frontend-dependencies" else set()
              )
              if not required.issubset(names):
                  raise SystemExit(f"Missing expected components in SBOM: {name}")
          PY
          curl --fail --location --retry 3 \
            -o sbom/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
          echo 'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  sbom/cyclonedx' | sha256sum --check
          chmod +x sbom/cyclonedx
          sbom/cyclonedx merge \
            --input-files sbom/api-amd64.json sbom/api-arm64.json sbom/web-amd64.json sbom/web-arm64.json sbom/frontend-dependencies.json \
            --output-file dist/clinicpulse.cdx.json --output-format json --output-version v1_5
          sbom/cyclonedx validate --input-file dist/clinicpulse.cdx.json --fail-on-errors
          python -c "import json; d=json.load(open('dist/clinicpulse.cdx.json')); c=d.get('components', []); assert d['bomFormat'] == 'CycloneDX' and d['specVersion'] == '1.5' and c; assert all(any(x.get('name', '').lower() == n for x in c) for n in ('fastapi', 'vue', 'vite'))"

      - name: Prepare pinned release artifacts
        id: prepare
        run: |
          mkdir -p dist
          sed "s/__IMAGE_TAG__/${IMAGE_TAG}/g" \
            docker/compose.release.yaml > dist/compose.yaml
          cp deploy/install.sh dist/install.sh
          cp docker/compose.encrypted.yaml dist/compose.encrypted.yaml
          cp deploy/dependency_track_upload.py dist/dependency_track_upload.py
          chmod +x dist/install.sh
          (cd dist && sha256sum compose.yaml compose.encrypted.yaml install.sh clinicpulse.cdx.json dependency_track_upload.py > SHA256SUMS)

      - name: Publish release artifacts
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$IMAGE_TAG" in *-*) prerelease="--prerelease";; esac
          gh release view "$IMAGE_TAG" >/dev/null 2>&1 || gh release create "$IMAGE_TAG" --title "$IMAGE_TAG" --generate-notes $prerelease
          gh release upload "$IMAGE_TAG" dist/compose.yaml dist/compose.encrypted.yaml dist/install.sh dist/clinicpulse.cdx.json dist/dependency_track_upload.py dist/SHA256SUMS --clobber
      - name: Summarize release publication
        if: always()
        env:
          BACKEND_STATUS: ${{ steps.backend_image.outcome }}
          WEB_STATUS: ${{ steps.web_image.outcome }}
          SBOM_STATUS: ${{ steps.sbom.outcome }}
          PREPARE_STATUS: ${{ steps.prepare.outcome }}
          PUBLISH_STATUS: ${{ steps.publish.outcome }}
        run: |
          {
            printf '## Release publication\n\nTag: `%s`\n\n' "$IMAGE_TAG"
            printf '| Check | Status |\n| --- | --- |\n'
            printf '| Backend image | %s |\n' "${BACKEND_STATUS:-not run}"
            printf '| Web image | %s |\n' "${WEB_STATUS:-not run}"
            printf '| Generate and validate SBOM | %s |\n' "${SBOM_STATUS:-not run}"
            printf '| Prepare release artifacts | %s |\n' "${PREPARE_STATUS:-not run}"
            printf '| Publish release artifacts | %s |\n' "${PUBLISH_STATUS:-not run}"
            echo
            echo 'See the Docker build summaries and step logs for details.'
          } >> "$GITHUB_STEP_SUMMARY"
