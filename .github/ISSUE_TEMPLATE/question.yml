name: Question
description: Ask about using, configuring, or installing ClinicPulse
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/CyberspaceConsulting/ClinicPulse#readme), [documentation](https://github.com/CyberspaceConsulting/ClinicPulse/tree/alpha/docs), and existing issues first.

        Do not include real patient or employee data, passwords, license tokens, encryption keys, or other secrets.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know? Include enough detail to understand the context.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Include relevant documentation or steps you have already checked.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: ClinicPulse version
      placeholder: "e.g. v-0.2.0-alpha"
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local development setup
        - Not installed yet
        - Other
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized configuration snippets or screenshots if useful.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the README, documentation, and existing issues.
          required: true
        - label: I removed sensitive information and secrets.
          required: true
