services:
  db:
    restart: "no"
    volumes:
      - type: bind
        source: ${MEDORA_ENCRYPTED_PGDATA:?Set MEDORA_ENCRYPTED_PGDATA to an existing directory on encrypted storage}
        target: /var/lib/postgresql
        bind:
          create_host_path: false
  backend:
    restart: "no"
  web:
    restart: "no"
