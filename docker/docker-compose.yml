name: medora

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clinicpulse
      POSTGRES_USER: clinicpulse
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - medora_data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicpulse -d clinicpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: clinicpulse
      DB_USER: clinicpulse
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      MEDORA_MANAGED_KEY_FILE: /var/lib/medora-secrets/data_encryption_key
      MEDORA_MANAGED_SMTP_PASSWORD_FILE: /var/lib/medora-secrets/smtp_password
      MEDORA_LICENSE_API_URL: ${MEDORA_LICENSE_API_URL:-https://lic.api.cyberspaceconsulting.de/api/v1}
      MEDORA_PUBLIC_URL: ${MEDORA_PUBLIC_URL:-}
      MEDORA_SMTP_HOST: ${MEDORA_SMTP_HOST:-}
      MEDORA_SMTP_PORT: ${MEDORA_SMTP_PORT:-587}
      MEDORA_SMTP_USERNAME: ${MEDORA_SMTP_USERNAME:-}
      MEDORA_SMTP_PASSWORD_FILE: ${MEDORA_SMTP_PASSWORD_FILE:-}
      MEDORA_SMTP_FROM: ${MEDORA_SMTP_FROM:-}
      MEDORA_SMTP_USE_SSL: ${MEDORA_SMTP_USE_SSL:-false}
      MEDORA_SMTP_USE_STARTTLS: ${MEDORA_SMTP_USE_STARTTLS:-true}
      MEDORA_BACKUP_DIR: /backups
      MEDORA_VERSION: ${MEDORA_VERSION:-0.1.0}
    volumes:
      - ${MEDORA_BACKUP_HOST_DIR:-../backups}:/backups
      - medora_keys:/var/lib/medora-secrets
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - application
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: ../docker/web.Dockerfile
    ports:
      - "${MEDORA_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - application
    restart: unless-stopped

networks:
  database:
    internal: true
  application:

volumes:
  medora_data:
    name: clinicpulse_clinicpulse_data
  medora_keys:
    name: clinicpulse_clinicpulse_keys
